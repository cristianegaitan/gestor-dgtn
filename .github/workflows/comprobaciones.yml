name: Comprobaciones

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      # Configuración ficticia para compilar. Las pruebas usan sus propios datos.
      VITE_SUPABASE_URL: https://gestor-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_prueba_ci
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código con ESLint
        run: npm run lint

      - name: Ejecutar las pruebas de API, respaldos, sincronización y SQL
        run: npm test

      - name: Comprobar tipos y compilar
        run: npm run build
